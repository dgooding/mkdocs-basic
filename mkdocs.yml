site_name: ITSD Documentation
site_description: IT Service Delivery documentation and operational guidance.
site_url: https://dgooding.github.io/mkdocs-basic/

theme:
  name: material
  language: en
  logo: assets/itsd-mark.svg
  favicon: assets/itsd-mark.svg
  font:
    text: Source Sans 3
    code: IBM Plex Mono
  palette:
    - scheme: default
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: blue
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tooltips

plugins:
  - search
  - tags
  - privacy:
      assets: false
  - offline

markdown_extensions:
  - meta
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: Copyright &copy; 2026 IT Service Delivery

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/document-library.js
  - javascripts/document-search.js
  - javascripts/global-search.js
  - javascripts/change-log-link.js
  - javascripts/support-suggestions.js

nav:
  - Home: index.md
  - Documents: uploaded-documents.md
  - Support: support.md
  - About: about.md
  - Contact: contact.md
  